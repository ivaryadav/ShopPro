<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z-SUPERADMIN</title>
<style>
:root{--bg:#0b0c10;--bg2:#131419;--bg3:#1a1c23;--text:#f5f5f7;--text2:rgba(255,255,255,.6);--text3:rgba(255,255,255,.35);--border:rgba(255,255,255,.08);--accent:#7C8CF8;--red:#F87171;--green:#34D399;--orange:#FBBF24}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none !important}
.glass-card{background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:16px;padding:20px}
.btn{padding:9px 16px;border-radius:9px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#7C8CF8,#A78BFA);color:#fff}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text2);border:1px solid var(--border)}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.btn-success{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.3)}
.btn-xs{padding:5px 10px;font-size:11px;border-radius:7px}
input,select,textarea{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;color:var(--text3);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid var(--border)}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700}
.badge-green{background:rgba(52,211,153,.15);color:var(--green)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red)}
.badge-orange{background:rgba(251,191,36,.15);color:var(--orange)}
.badge-gray{background:rgba(255,255,255,.08);color:var(--text3)}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
#app-shell{display:none;min-height:100vh}
#sidebar{width:230px;background:var(--bg2);border-right:1px solid var(--border);flex-shrink:0;padding:16px}
#main{flex:1;padding:24px;overflow:auto}
.nav-item{padding:10px 12px;border-radius:9px;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:2px}
.nav-item:hover{background:var(--bg3)}
.nav-item.active{background:rgba(124,140,248,.15);color:var(--accent)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{text-align:center}
.kpi-label{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-value{font-size:24px;font-weight:800;color:var(--accent)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:9999}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:600px;width:92%;max-height:85vh;overflow:auto}
.row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,.04)}
.row span:first-child{color:var(--text3)}
.section-title{font-size:11px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 6px}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:99999;animation:toastIn .2s}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── Nav grouping ── */
.nav-group{margin-bottom:10px}
.nav-group-label{font-size:9px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;padding:8px 12px 4px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.nav-group-label .chev{transition:transform .15s}
.nav-group.collapsed .chev{transform:rotate(-90deg)}
.nav-group.collapsed .nav-item{display:none}

/* ── Notification bell ── */
#notif-bell{position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--border)}
#notif-badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:8px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
#notif-dropdown{position:absolute;top:44px;right:0;width:320px;max-height:400px;overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);z-index:9998;padding:8px}
.alert-row{padding:8px 10px;border-radius:8px;margin-bottom:4px;font-size:12px}
.alert-row.sev-critical{background:rgba(239,68,68,.1);border-left:3px solid var(--red)}
.alert-row.sev-warning{background:rgba(251,191,36,.1);border-left:3px solid var(--orange)}
.alert-row.sev-info{background:rgba(124,140,248,.1);border-left:3px solid var(--accent)}
.alert-row .alert-title{font-weight:700;margin-bottom:2px}
.alert-row .alert-msg{color:var(--text2);font-size:11px}
.alert-row .alert-actions{display:flex;gap:6px;margin-top:6px}

/* ── Breadcrumb ── */
.breadcrumb{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px}

/* ── Command palette ── */
.cmdk-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:99998}
.cmdk-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:520px;max-width:92vw;max-height:60vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.cmdk-box input{border:none;border-bottom:1px solid var(--border);border-radius:0;padding:14px 16px;font-size:15px;background:transparent}
.cmdk-results{overflow:auto;padding:6px}
.cmdk-item{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between}
.cmdk-item:hover,.cmdk-item.sel{background:var(--bg3)}
.cmdk-item .cmdk-hint{color:var(--text3);font-size:10px;text-transform:uppercase}

/* ── Tablet / responsive ── */
.table-scroll{overflow-x:auto}
@media (max-width:900px){
  #app-shell{flex-direction:column}
  #sidebar{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:10px}
  #sidebar .nav-group{display:flex;align-items:center;margin-bottom:0}
  #sidebar .nav-group-label{display:none}
  #sidebar .nav-item{display:inline-block;margin-bottom:0}
  #sidebar > div[style*="margin-bottom:16px"]{width:100%}
  .kpi-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .modal-box{max-width:96vw}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="glass-card" style="width:360px">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:22px;font-weight:800">Z-SUPERADMIN</div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">Platform foundation for every ZMAX SaaS product</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <input id="li-email" placeholder="Platform email" type="email">
      <input id="li-password" placeholder="Password" type="password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn btn-primary" onclick="doLogin()" style="width:100%">Log In</button>
      <div id="li-error" style="color:var(--red);font-size:11px;text-align:center;min-height:14px"></div>
    </div>
  </div>
</div>

<div id="app-shell" style="display:flex">
  <div id="sidebar">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <div style="font-size:15px;font-weight:800">🛡️ Z-SUPERADMIN</div>
      <div id="notif-bell" onclick="toggleNotifDropdown()">
        🔔<span id="notif-badge" class="hidden">0</span>
        <div id="notif-dropdown" class="hidden" onclick="event.stopPropagation()"></div>
      </div>
    </div>
    <div style="font-size:10px;color:var(--text3);margin-bottom:16px" id="sb-user"></div>
    <div style="margin-bottom:16px">
      <label style="font-size:9px;color:var(--text3);text-transform:uppercase;font-weight:700">Product Switcher</label>
      <select id="product-switcher" style="width:100%;margin-top:4px" onchange="onProductSwitch()">
        <option value="">All Products</option>
      </select>
    </div>
    <div class="nav-group">
      <div class="nav-group-label" onclick="toggleNavGroup(this)"><span>Overview</span><span class="chev">▾</span></div>
      <div class="nav-item active" data-page="dashboard" onclick="nav('dashboard')">📈 Dashboard</div>
      <div class="nav-item" data-page="reports" onclick="nav('reports')">📊 Reports</div>
    </div>
    <div class="nav-group">
      <div class="nav-group-label" onclick="toggleNavGroup(this)"><span>Customers</span><span class="chev">▾</span></div>
      <div class="nav-item" data-page="organizations" onclick="nav('organizations')">🏢 Organizations</div>
    </div>
    <div class="nav-group">
      <div class="nav-group-label" onclick="toggleNavGroup(this)"><span>Products</span><span class="chev">▾</span></div>
      <div class="nav-item" data-page="products" onclick="nav('products')">🧩 Product Registry</div>
    </div>
    <div class="nav-group">
      <div class="nav-group-label" onclick="toggleNavGroup(this)"><span>Operations</span><span class="chev">▾</span></div>
      <div class="nav-item" data-page="health" onclick="nav('health')">💚 System Health</div>
      <div class="nav-item" data-page="alerts" onclick="nav('alerts')">🔔 Alerts</div>
      <div class="nav-item" data-page="audit" onclick="nav('audit')">🧾 Audit Log</div>
    </div>
    <div class="nav-group">
      <div class="nav-group-label" onclick="toggleNavGroup(this)"><span>Settings</span><span class="chev">▾</span></div>
      <div class="nav-item" data-page="platform-users" onclick="nav('platform-users')">👤 Platform Users</div>
    </div>
    <div style="margin-top:10px;padding-top:14px;border-top:1px solid var(--border)">
      <div style="font-size:10px;color:var(--text3);margin-bottom:8px">Press <b>⌘K</b> / <b>Ctrl+K</b> to search</div>
      <button class="btn btn-ghost" style="width:100%" onclick="doLogout()">Log Out</button>
    </div>
  </div>
  <div id="main"></div>
</div>

<div id="cmdk-overlay" class="cmdk-overlay hidden">
  <div class="cmdk-box">
    <input id="cmdk-input" placeholder="Search pages or organizations…" oninput="cmdkSearch()" onkeydown="cmdkKeydown(event)">
    <div class="cmdk-results" id="cmdk-results"></div>
  </div>
</div>

<script>
const API = window.location.origin + '/api/platform';
let TOKEN = sessionStorage.getItem('zsa_token') || '';
let ME = null;
let PRODUCTS = [];
let CURRENT_PRODUCT = '';
let CURRENT_PAGE = 'dashboard';

function esc(s){ return String(s===null||s===undefined?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.background = type==='error' ? 'rgba(239,68,68,.9)' : type==='success' ? 'rgba(52,211,153,.9)' : 'rgba(124,140,248,.9)';
  t.style.color = '#fff';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
async function api(path, opts){
  opts = opts || {};
  const res = await fetch(API + path, {
    method: opts.method || 'GET',
    headers: Object.assign({ 'Content-Type': 'application/json' }, TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}),
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || 'Request failed');
  return data;
}

async function doLogin(){
  const email = document.getElementById('li-email').value.trim();
  const password = document.getElementById('li-password').value;
  const errEl = document.getElementById('li-error');
  errEl.textContent = '';
  try {
    const result = await api('/auth/login', { method: 'POST', body: { email, password } });
    TOKEN = result.token; ME = result.user;
    sessionStorage.setItem('zsa_token', TOKEN);
    sessionStorage.setItem('zsa_user', JSON.stringify(ME));
    showApp();
  } catch (e) { errEl.textContent = e.message; }
}
function doLogout(){
  TOKEN = ''; sessionStorage.removeItem('zsa_token'); sessionStorage.removeItem('zsa_user');
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}
function hasPermission(code){ return !!(ME && ME.permissions && ME.permissions.includes(code)); }

async function showApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'flex';
  document.getElementById('sb-user').textContent = ME.email + ' — ' + ME.roleLabel;
  await loadProducts();
  nav('dashboard');
  startNotifPolling();
}
async function loadProducts(){
  const d = await api('/products');
  PRODUCTS = d.products;
  const sel = document.getElementById('product-switcher');
  sel.innerHTML = '<option value="">All Products</option>' + PRODUCTS.map(p => `<option value="${p.id}">${esc(p.name)}${p.status==='planned'?' (planned)':''}</option>`).join('');
}
function onProductSwitch(){
  CURRENT_PRODUCT = document.getElementById('product-switcher').value;
  nav(CURRENT_PAGE);
}
const PAGE_LABELS = {
  dashboard: 'Overview / Dashboard', reports: 'Overview / Reports', organizations: 'Customers / Organizations',
  products: 'Products / Product Registry', health: 'Operations / System Health', alerts: 'Operations / Alerts',
  audit: 'Operations / Audit Log', 'platform-users': 'Settings / Platform Users',
};
function breadcrumb(){ return '<div class="breadcrumb">' + esc(PAGE_LABELS[CURRENT_PAGE] || CURRENT_PAGE) + '</div>'; }
function nav(page){
  CURRENT_PAGE = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.getAttribute('data-page') === page));
  const renderers = {
    dashboard: renderDashboard, organizations: renderOrganizations, products: renderProducts, audit: renderAudit,
    'platform-users': renderPlatformUsers, health: renderHealth, alerts: renderAlertsPage, reports: renderReports,
  };
  (renderers[page] || renderDashboard)();
}
function toggleNavGroup(labelEl){ labelEl.parentElement.classList.toggle('collapsed'); }

// ── Dashboard ──
async function renderDashboard(){
  const main = document.getElementById('main');
  main.innerHTML = '<div style="color:var(--text3)">Loading…</div>';
  try {
    const qs = CURRENT_PRODUCT ? '?productId=' + CURRENT_PRODUCT : '';
    const d = await api('/dashboard/stats' + qs);
    const kpis = [
      ['Total Organizations', d.totalOrganizations], ['Total Products', d.totalProducts],
      ['Active Licenses', d.activeLicenses], ['Expired Licenses', d.expiredLicenses],
      ['Pending Registrations', d.pendingRegistrations], ['Online Orgs Today', d.onlineOrganizationsToday],
      ['Revenue', '₹' + d.revenue], ['Expiring Licenses', d.expiringLicenses],
      ['Active Devices', d.activeDevices],
    ];
    let html = breadcrumb() + '<h2 style="margin-top:0">Platform Dashboard</h2><div class="kpi-grid">';
    kpis.forEach(k => { html += `<div class="glass-card kpi-card"><div class="kpi-label">${esc(k[0])}</div><div class="kpi-value">${k[1]}</div></div>`; });
    html += '</div>';
    html += '<div class="glass-card"><div style="font-weight:700;margin-bottom:10px">Recent Organizations</div>';
    if (!d.recentOrganizations.length) html += '<div style="color:var(--text3);font-size:12px">None yet.</div>';
    else {
      html += '<table><thead><tr><th>Business</th><th>Owner</th><th>Email</th><th>Created</th></tr></thead><tbody>';
      d.recentOrganizations.forEach(o => { html += `<tr style="cursor:pointer" onclick="showOrgDetail(${esc(JSON.stringify(o.id))})"><td>${esc(o.businessName)}</td><td>${esc(o.ownerName)}</td><td>${esc(o.email)}</td><td>${o.createdAt ? new Date(o.createdAt).toLocaleDateString() : ''}</td></tr>`; });
      html += '</tbody></table>';
    }
    html += '</div>';
    main.innerHTML = html;
  } catch (e) { main.innerHTML = '<div style="color:var(--red)">' + esc(e.message) + '</div>'; }
}

// ── Organizations ──
let ORG_STATE = { q: '', status: '', page: 1 };
async function renderOrganizations(){
  const main = document.getElementById('main');
  main.innerHTML = `
    ${breadcrumb()}
    <h2 style="margin-top:0">Organizations</h2>
    <div class="glass-card" style="margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap">
      <input id="org-search" placeholder="Search business, owner, email, phone, GST…" style="flex:1;min-width:200px" onkeydown="if(event.key==='Enter')orgSearch()">
      <select id="org-status" onchange="orgSearch()">
        <option value="">All Statuses</option><option value="PENDING_APPROVAL">Pending</option>
        <option value="ACTIVE">Active</option><option value="SUSPENDED">Suspended</option><option value="ARCHIVED">Archived</option>
      </select>
      <button class="btn btn-ghost" onclick="orgSearch()">Search</button>
      ${hasPermission('manage_organizations') ? '<button class="btn btn-primary" onclick="createOrgPrompt()">+ New Organization</button>' : ''}
    </div>
    <div id="org-table" class="glass-card"></div>
  `;
  await loadOrganizations();
}
function orgSearch(){
  ORG_STATE.q = document.getElementById('org-search').value.trim();
  ORG_STATE.status = document.getElementById('org-status').value;
  ORG_STATE.page = 1;
  loadOrganizations();
}
async function loadOrganizations(){
  const el = document.getElementById('org-table');
  el.innerHTML = 'Loading…';
  try {
    let qs = '?page=' + ORG_STATE.page;
    if (ORG_STATE.q) qs += '&q=' + encodeURIComponent(ORG_STATE.q);
    if (ORG_STATE.status) qs += '&status=' + encodeURIComponent(ORG_STATE.status);
    if (CURRENT_PRODUCT) qs += '&productId=' + CURRENT_PRODUCT;
    const d = await api('/organizations' + qs);
    if (!d.organizations.length) { el.innerHTML = '<div style="color:var(--text3)">No organizations match.</div>'; return; }
    const statusClass = { PENDING_APPROVAL: 'badge-orange', ACTIVE: 'badge-green', SUSPENDED: 'badge-red', ARCHIVED: 'badge-gray' };
    let html = '<table><thead><tr><th>Business</th><th>Owner</th><th>Email</th><th>Status</th><th>Created</th></tr></thead><tbody>';
    d.organizations.forEach(o => {
      html += `<tr style="cursor:pointer" onclick="showOrgDetail(${esc(JSON.stringify(o.id))})"><td><strong>${esc(o.businessName)}</strong></td><td>${esc(o.ownerName)}</td><td>${esc(o.email)}</td><td><span class="badge ${statusClass[o.status] || 'badge-gray'}">${esc(o.status)}</span></td><td>${o.createdAt ? new Date(o.createdAt).toLocaleDateString() : ''}</td></tr>`;
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch (e) { el.innerHTML = '<div style="color:var(--red)">' + esc(e.message) + '</div>'; }
}
function createOrgPrompt(){
  const businessName = prompt('Business Name:'); if (!businessName) return;
  const ownerName = prompt('Owner Name:') || '';
  const email = prompt('Email:') || '';
  const phone = prompt('Phone:') || '';
  api('/organizations', { method: 'POST', body: { businessName, ownerName, email, phone } })
    .then(() => { toast('Organization created', 'success'); loadOrganizations(); })
    .catch(e => toast(e.message, 'error'));
}
async function showOrgDetail(id){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'org-modal';
  overlay.innerHTML = '<div class="modal-box">Loading…</div>';
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  try {
    const [d, renewalsData, securityData, notesData, activityData] = await Promise.all([
      api('/organizations/' + id),
      api('/organizations/' + id + '/renewals').catch(() => ({ licenses: [] })),
      api('/organizations/' + id + '/security').catch(() => ({ loginHistory: [], failedLogins: [], securityEvents: [] })),
      api('/organizations/' + id + '/notes').catch(() => ({ notes: [] })),
      api('/organizations/' + id + '/activity').catch(() => ({ timeline: [] })),
    ]);
    const b = d.business;
    function row(l, v) { return `<div class="row"><span>${esc(l)}</span><span>${v === null || v === undefined || v === '' ? '—' : esc(v)}</span></div>`; }
    let html = `<button onclick="document.getElementById('org-modal').remove()" style="float:right;background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer">✕</button>`;
    html += `<h3 style="margin-top:0">${esc(b.businessName)}</h3>`;
    html += '<div class="section-title">Business Information</div>';
    html += row('Owner', b.ownerName) + row('Email', b.email) + row('Phone', b.phone) + row('Address', b.address) + row('GST', b.gstNumber) + row('Status', b.status) + row('Created', b.createdAt ? new Date(b.createdAt).toLocaleString() : null);
    html += '<div class="section-title">Products</div>';
    if (!d.products.length) html += '<div style="color:var(--text3);font-size:12px">No products attached.</div>';
    d.products.forEach(p => { html += row(p.productName, p.status); });
    if (hasPermission('manage_organizations')) {
      html += `<select id="attach-product-select" style="margin-top:8px">${PRODUCTS.filter(p => !d.products.some(x => x.productId === p.id)).map(p => `<option value="${esc(p.slug)}">${esc(p.name)}</option>`).join('')}</select> <button class="btn btn-xs btn-ghost" onclick="attachProduct(${esc(JSON.stringify(id))})">Attach Product</button>`;
    }
    html += '<div class="section-title">Licenses</div>';
    if (!d.licenses.length) html += '<div style="color:var(--text3);font-size:12px">No licenses yet.</div>';
    d.licenses.forEach(l => {
      html += row(l.productName + ' — ' + l.planCode, l.status + (l.expiresAt ? ' (expires ' + new Date(l.expiresAt).toLocaleDateString() + ')' : ' (never expires)'));
      if (hasPermission('manage_licenses')) {

let _notifIntervalStarted = false;
async function loadNotifBadge(){
  try {
    const d = await api('/alerts');
    const badge = document.getElementById('notif-badge');
    if (d.unreadCount > 0) { badge.textContent = d.unreadCount > 99 ? '99+' : d.unreadCount; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
    window._LAST_ALERTS = d.alerts;
  } catch (e) { /* best-effort — a failed badge refresh should never interrupt the operator */ }
}
function startNotifPolling(){
  if (_notifIntervalStarted) return;
  _notifIntervalStarted = true;
  loadNotifBadge();
  setInterval(loadNotifBadge, 60000);
}
let NOTIF_DROPDOWN_OPEN = false;
function toggleNotifDropdown(){
  const dd = document.getElementById('notif-dropdown');
  NOTIF_DROPDOWN_OPEN = !NOTIF_DROPDOWN_OPEN;
  if (NOTIF_DROPDOWN_OPEN) { renderNotifDropdown(); dd.classList.remove('hidden'); }
  else dd.classList.add('hidden');
}
function renderNotifDropdown(){
  const dd = document.getElementById('notif-dropdown');
  const alerts = window._LAST_ALERTS || [];
  if (!alerts.length) { dd.innerHTML = '<div style="padding:10px;color:var(--text3);font-size:12px">No alerts.</div>'; return; }
  dd.innerHTML = alerts.slice(0, 8).map(a => `
    <div class="alert-row sev-${esc(a.severity)}">
      <div class="alert-title">${esc(a.title)}</div><div class="alert-msg">${esc(a.message)}</div>
      <div class="alert-actions">
        ${!a.readAt ? `<button class="btn btn-xs btn-ghost" onclick="markAlertRead('${encodeURIComponent(a.key)}')">Mark Read</button>` : ''}
        <button class="btn btn-xs btn-ghost" onclick="dismissAlert('${encodeURIComponent(a.key)}')">Dismiss</button>
      </div>
    </div>`).join('') + '<div style="text-align:center;margin-top:6px"><button class="btn btn-xs btn-ghost" onclick="nav(\'alerts\');toggleNotifDropdown()">View All</button></div>';
}

// ── Reports & Trends (Phase 5A) ──
async function renderReports(){
  const main = document.getElementById('main');
  main.innerHTML = breadcrumb() + '<h2 style="margin-top:0">Reports & Trends</h2><div id="reports-body" class="glass-card">Loading…</div>';
  try {
    const d = await api('/reports/trends');
    function sparkline(series, key){
      if (!series || !series.length) return '<div style="color:var(--text3);font-size:12px">No data yet.</div>';
      const max = Math.max(...series.map(s => s[key])) || 1;
      const w = 600, h = 70, step = w / Math.max(series.length - 1, 1);
      const points = series.map((s, i) => (i * step) + ',' + (h - (s[key] / max) * h)).join(' ');
      return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:70px;display:block"><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${points}"/></svg>`;
    }
    let html = '';
    html += '<div class="section-title" style="margin-top:0">Customer Growth (cumulative organizations)</div>' + sparkline(d.customerGrowth, 'total');
    html += '<div class="section-title">Registration Trends (new organizations per month)</div>' + sparkline(d.registrationTrends, 'count');
    html += '<div class="section-title">License Status Mix</div>';
    const licRows = Object.entries(d.licenseTrends || {}).map(([status, count]) => `<div class="row"><span>${esc(status)}</span><span>${count}</span></div>`).join('');
    html += licRows || '<div style="color:var(--text3);font-size:12px">No license data yet.</div>';
    html += '<div class="section-title">Product Usage</div>';
    const usageRows = (d.productUsage || []).map(p => `<div class="row"><span>${esc(p.product)}</span><span>${p.organizations}</span></div>`).join('');
    html += usageRows || '<div style="color:var(--text3);font-size:12px">No products in use yet.</div>';
    html += '<div class="section-title">Activity (last 30 days)</div>' + sparkline(d.activityMetrics, 'count');
    document.getElementById('reports-body').innerHTML = html;
  } catch (e) { document.getElementById('reports-body').innerHTML = '<div style="color:var(--red)">' + esc(e.message) + '</div>'; }
}

// ── Command palette ──
const NAV_ITEMS_FOR_CMDK = [
  { label: 'Dashboard', page: 'dashboard' }, { label: 'Reports', page: 'reports' },
  { label: 'Organizations', page: 'organizations' }, { label: 'Product Registry', page: 'products' },
  { label: 'System Health', page: 'health' }, { label: 'Alerts', page: 'alerts' },
  { label: 'Audit Log', page: 'audit' }, { label: 'Platform Users', page: 'platform-users' },
];
let CMDK_RESULTS = [];
let CMDK_SEL = 0;
function openCmdk(){
  document.getElementById('cmdk-overlay').classList.remove('hidden');
  const input = document.getElementById('cmdk-input');
  input.value = '';
  input.focus();
  cmdkSearch();
}
function closeCmdk(){ document.getElementById('cmdk-overlay').classList.add('hidden'); }
async function cmdkSearch(){
  const q = document.getElementById('cmdk-input').value.trim().toLowerCase();
  let results = NAV_ITEMS_FOR_CMDK.filter(n => !q || n.label.toLowerCase().includes(q)).map(n => ({ type: 'nav', label: n.label, page: n.page }));
  if (q.length >= 2) {
    try {
      const d = await api('/customers/search?q=' + encodeURIComponent(q));
      results = results.concat((d.results || []).slice(0, 6).map(o => ({ type: 'org', label: o.businessName, id: o.organizationId })));
    } catch (e) { /* a broken search should never block palette navigation */ }
  }
  CMDK_RESULTS = results;
  CMDK_SEL = 0;
  renderCmdkResults();
}
function renderCmdkResults(){
  const el = document.getElementById('cmdk-results');
  if (!CMDK_RESULTS.length) { el.innerHTML = '<div style="padding:10px;color:var(--text3);font-size:12px">No matches.</div>'; return; }
  el.innerHTML = CMDK_RESULTS.map((r, i) => `<div class="cmdk-item ${i===CMDK_SEL?'sel':''}" onclick="cmdkSelect(${i})"><span>${esc(r.label)}</span><span class="cmdk-hint">${r.type==='nav'?'page':'organization'}</span></div>`).join('');
}
function cmdkSelect(i){
  const r = CMDK_RESULTS[i];
  if (!r) return;
  closeCmdk();
  if (r.type === 'nav') nav(r.page);
  else { nav('organizations'); showOrgDetail(r.id); }
}
function cmdkKeydown(e){
  if (e.key === 'ArrowDown') { e.preventDefault(); CMDK_SEL = Math.min(CMDK_SEL + 1, CMDK_RESULTS.length - 1); renderCmdkResults(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); CMDK_SEL = Math.max(CMDK_SEL - 1, 0); renderCmdkResults(); }
  else if (e.key === 'Enter') { e.preventDefault(); cmdkSelect(CMDK_SEL); }
  else if (e.key === 'Escape') { closeCmdk(); }
}
document.addEventListener('keydown', function(e){
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (ME) openCmdk();
  } else if (e.key === 'Escape') {
    closeCmdk();
  }
});
document.getElementById('cmdk-overlay').addEventListener('click', function(e){ if (e.target === this) closeCmdk(); });

// ── Boot ──
(function boot(){
  if (TOKEN) {
    try { ME = JSON.parse(sessionStorage.getItem('zsa_user') || 'null'); } catch (_) { ME = null; }
    if (ME) { showApp(); return; }
  }
  document.getElementById('login-screen').style.display = 'flex';
})();
</script>
